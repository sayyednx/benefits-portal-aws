spring:
  application:
    name: benefits-portal-aws
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/benefits_portal?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:benefits_app}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # A little above documents.max-bytes, so DocumentService gives the friendly message.
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: ${SERVER_PORT:8080}

# Benefit calculation — see ClaimService for how these are used.
benefits:
  wage-replacement-rate: ${BENEFITS_WAGE_REPLACEMENT_RATE:0.5}
  max-weekly-benefit: ${BENEFITS_MAX_WEEKLY:500.00}
  min-weekly-benefit: ${BENEFITS_MIN_WEEKLY:50.00}
  # Days a claimant has to appeal a denial.
  appeal-window-days: ${BENEFITS_APPEAL_WINDOW_DAYS:30}
  # Weekly certification and payment rules.
  max-weeks: ${BENEFITS_MAX_WEEKS:26}
  min-job-contacts: ${BENEFITS_MIN_JOB_CONTACTS:3}
  earnings-disregard-rate: ${BENEFITS_EARNINGS_DISREGARD_RATE:0.25}
  waiting-week: ${BENEFITS_WAITING_WEEK:true}

# Automatic fraud checks on new claims (see FraudCheckService).
fraud:
  high-wage-threshold: ${FRAUD_HIGH_WAGE_THRESHOLD:4000.00}

# Uploaded documents. "local" keeps files in a folder (for docker compose);
# "s3" keeps them in an S3 bucket (Terraform sets this on the EC2 instance).
documents:
  storage: ${DOCUMENTS_STORAGE:local}
  local-dir: ${DOCUMENTS_LOCAL_DIR:uploads}
  max-bytes: 5242880
  s3:
    bucket: ${DOCUMENTS_S3_BUCKET:}
    region: ${DOCUMENTS_S3_REGION:us-east-1}

# There is deliberately no default password: the app refuses to start until
# ADMIN_PASSWORD is set (see SecurityConfig).
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.nabeelsayyed.benefitsportal: INFO
