spring:
  application:
    name: benefits-portal-aws
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/benefits_portal?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:benefits_app}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}

# Benefit calculation — see ClaimService for how these are used.
benefits:
  wage-replacement-rate: ${BENEFITS_WAGE_REPLACEMENT_RATE:0.5}
  max-weekly-benefit: ${BENEFITS_MAX_WEEKLY:500.00}
  min-weekly-benefit: ${BENEFITS_MIN_WEEKLY:50.00}

# There is deliberately no default password: the app refuses to start until
# ADMIN_PASSWORD is set (see SecurityConfig).
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.nabeelsayyed.benefitsportal: INFO
