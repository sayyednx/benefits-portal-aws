<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check My Claim — Benefits Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: publicHeader}"></header>

<main class="wrap narrow">
    <h1>Check my claim</h1>
    <p class="lede">Enter the confirmation number you got when you filed, and the email you used.</p>

    <p class="flash flash-error" th:if="${error}" th:text="${error}" role="alert"></p>

    <form th:action="@{/status}" method="post" class="form">
        <div class="field">
            <label for="confirmationNumber">Confirmation number</label>
            <input type="text" id="confirmationNumber" name="confirmationNumber" placeholder="UI-XXXX-XXXX"
                   th:value="${confirmationNumber}" autocomplete="off" required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" class="btn-primary">Check status</button>
    </form>
</main>
</body>
</html>
