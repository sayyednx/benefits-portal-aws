<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Staff accounts')}"></head>
<body class="staff">
<header th:replace="~{fragments :: staffHeader}"></header>

<main id="main" class="wrap">
    <h1>Staff accounts</h1>
    <p class="lede">Caseworkers review claims. Supervisors can also decide appeals and manage accounts.</p>

    <p class="flash flash-ok" th:if="${message}" th:text="${message}" role="status"></p>
    <p class="flash flash-error" th:if="${error}" th:text="${error}" role="alert"></p>

    <div class="table-wrap">
    <table class="claims-table">
        <thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="s : ${staff}">
            <td th:text="${s.username}"></td>
            <td th:text="${s.fullName}"></td>
            <td th:text="${s.role}"></td>
            <td><span class="status-pill" th:classappend="${s.active} ? 'status-approved' : 'status-denied'"
                      th:text="${s.active} ? 'Active' : 'Switched off'"></span></td>
            <td>
                <form th:action="@{/admin/staff/{id}/active(id=${s.id})}" method="post">
                    <input type="hidden" name="active" th:value="${!s.active}">
                    <button type="submit" class="link-btn" th:text="${s.active} ? 'Switch off' : 'Switch on'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>

    <section class="card spaced">
        <h2>Add a staff member</h2>
        <form th:action="@{/admin/staff}" method="post" class="stack narrow-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="off">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required>
            <label for="role">Role</label>
            <select id="role" name="role">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>
            <label for="password">Temporary password (12+ characters)</label>
            <input type="password" id="password" name="password" minlength="12" required autocomplete="new-password">
            <button type="submit" class="btn-primary">Add staff member</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
