<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin — Benefits Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <div class="wrap">
        <span class="brand">Benefits Portal — Admin</span>
        <form th:action="@{/admin/logout}" method="post" class="logout-form">
            <button type="submit" class="link-btn">Log out</button>
        </form>
    </div>
</header>

<main class="wrap">
    <h1>Claims queue</h1>

    <div class="filter-row">
        <a th:href="@{/admin/claims}" th:classappend="${selectedStatus == null} ? 'chip-active' : ''" class="chip">All</a>
        <a th:each="s : ${statuses}"
           th:href="@{/admin/claims(status=${s})}"
           th:classappend="${selectedStatus == s.toString()} ? 'chip-active' : ''"
           th:text="${s}" class="chip"></a>
    </div>

    <table class="claims-table">
        <thead>
        <tr>
            <th>ID</th><th>Claimant</th><th>Employer</th><th>Reason</th>
            <th>Weekly wage</th><th>Benefit</th><th>Eligible</th><th>Status</th><th>Filed</th><th>Decision</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="claim : ${claims}">
            <td><a th:href="@{/admin/claims/{id}(id=${claim.id})}" th:text="${claim.id}"></a></td>
            <td>
                <div th:text="${claim.claimantName}"></div>
                <div class="muted" th:text="${claim.claimantEmail}"></div>
            </td>
            <td th:text="${claim.employerName}"></td>
            <td th:text="${claim.separationReason}"></td>
            <td th:text="'$' + ${claim.averageWeeklyWage}"></td>
            <td th:text="'$' + ${claim.weeklyBenefitAmount}"></td>
            <td>
                <span th:if="${claim.eligible}" class="status-pill status-approved">Yes</span>
                <span th:unless="${claim.eligible}" class="status-pill status-denied">No</span>
            </td>
            <td th:text="${claim.status}"></td>
            <td th:text="${#temporals.format(claim.filedAt, 'MMM d, h:mm a')}"></td>
            <td>
                <form th:action="@{/admin/claims/{id}/decision(id=${claim.id})}" method="post" class="decision-form">
                    <select name="status">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s == claim.status}"></option>
                    </select>
                    <input type="text" name="reviewerNotes" placeholder="Notes (optional)" th:value="${claim.reviewerNotes}">
                    <button type="submit" class="btn-small">Save</button>
                </form>
            </td>
        </tr>
        <tr th:if="${claims.isEmpty()}">
            <td colspan="10" class="muted">No claims match this filter.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
