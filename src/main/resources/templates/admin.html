<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Claims queue')}"></head>
<body class="staff">
<header th:replace="~{fragments :: staffHeader}"></header>

<main id="main" class="wrap">
    <h1>Claims queue</h1>
    <p class="lede">Review new claims, decide appeals, and clear fraud flags.</p>

    <div class="stat-row">
        <div class="stat"><div class="num" th:text="${countAll}">0</div><div class="lbl">All claims</div></div>
        <div class="stat"><div class="num" th:text="${countToReview}">0</div><div class="lbl">Waiting for review</div></div>
        <div class="stat"><div class="num" th:text="${countAppeals}">0</div><div class="lbl">Appeals to decide</div></div>
        <div class="stat"><div class="num" th:text="${flaggedIds.size()}">0</div><div class="lbl">Open fraud flags</div></div>
    </div>

    <div class="filter-row" aria-label="Filter claims">
        <a th:href="@{/admin/claims}" th:classappend="${selectedStatus == null and !flaggedOnly} ? 'chip-active' : ''" class="chip">All</a>
        <a th:each="s : ${statuses}"
           th:href="@{/admin/claims(status=${s})}"
           th:classappend="${selectedStatus == s.toString()} ? 'chip-active' : ''"
           th:text="${s.label}" class="chip"></a>
        <a th:href="@{/admin/claims(flagged=true)}" th:classappend="${flaggedOnly} ? 'chip-active' : ''" class="chip chip-flag"
           th:text="'Flagged (' + ${flaggedIds.size()} + ')'"></a>
    </div>

    <div class="table-wrap">
        <table class="claims-table">
            <thead>
            <tr>
                <th>ID</th><th>Claimant</th><th>Employer</th><th>Reason</th>
                <th>Weekly pay</th><th>Benefit</th><th>Status</th><th>Filed</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="claim : ${claims}">
                <td><a th:href="@{/admin/claims/{id}(id=${claim.id})}" th:text="'#' + ${claim.id}"></a></td>
                <td>
                    <div><strong th:text="${claim.claimantName}"></strong></div>
                    <div class="muted" th:text="${claim.claimantEmail}"></div>
                    <span th:if="${flaggedIds.contains(claim.id)}" class="status-pill status-flag" title="Open fraud flag">Flagged</span>
                </td>
                <td th:text="${claim.employerName}"></td>
                <td>
                    <div th:text="${claim.separationReason.label}"></div>
                    <span th:unless="${claim.eligible}" class="muted">Not monetarily eligible</span>
                </td>
                <td th:text="'$' + ${claim.averageWeeklyWage}"></td>
                <td th:text="'$' + ${claim.weeklyBenefitAmount}"></td>
                <td><span th:text="${claim.status.label}" th:classappend="'status-' + ${#strings.toLowerCase(claim.status)}" class="status-pill"></span></td>
                <td th:text="${#temporals.format(claim.filedAt, 'MMM d, h:mm a')}"></td>
                <td>
                    <a th:href="@{/admin/claims/{id}(id=${claim.id})}"
                       th:text="${claim.status.finalForStaff} ? 'View' : 'Review'" class="btn-small"></a>
                </td>
            </tr>
            <tr th:if="${claims.isEmpty()}">
                <td colspan="9" class="muted">No claims match this filter.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
