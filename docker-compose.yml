services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: benefits_portal
      MYSQL_USER: benefits_app
      MYSQL_PASSWORD: changeme
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/benefits_portal?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: benefits_app
      SPRING_DATASOURCE_PASSWORD: changeme
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme123

volumes:
  mysql_data:
