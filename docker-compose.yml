services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: benefits_portal
      MYSQL_USER: benefits_app
      MYSQL_PASSWORD: changeme
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A pretend email inbox. It catches every email the app sends, so nothing reaches a
  # real person. Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "8025:8025"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/benefits_portal?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: benefits_app
      SPRING_DATASOURCE_PASSWORD: changeme
      ADMIN_USERNAME: admin
      # Read from .env (copy .env.example). Compose stops with this message if it's missing.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (copy .env.example to .env)}
      # Locally, uploaded documents go in a Docker volume. In AWS they go to S3 instead.
      DOCUMENTS_STORAGE: local
      DOCUMENTS_LOCAL_DIR: /app/uploads
      # Emails go to Mailpit locally. In AWS they go through Amazon SES instead.
      NOTIFICATIONS_SENDER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NOTIFICATIONS_BASE_URL: http://localhost:8080
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
